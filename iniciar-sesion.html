<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Oportunia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="iniciar-sesion.css">
</head>

<body>

    <main class="pagina-login">

        <section class="login-container">

            <header class="login-header">
                <h1 class="logo">Oportunia</h1>
                <h2>Iniciar sesión</h2>
                <p>Ingresá a tu cuenta para continuar</p>
            </header>

           <form id="formulario-login">

                <div class="mb-4">
                    <label for="correo" class="form-label">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        required>
                </div>

                <div class="mb-3">
                    <label for="contrasena" class="form-label">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Ingresá tu contraseña"
                        required>
                </div>

                <div class="recuperar">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

              <button type="submit" class="btn btn-login w-100">
    Iniciar sesión
</button>
            </form>
            <script>
document.getElementById("formulario-login").addEventListener("submit", function(event) {
    event.preventDefault();

    window.location.href = "home.html";
});
</script>

            <div class="registro-link">
                <p>¿Todavía no tenés una cuenta?</p>

                <a href="registrarse.html" class="btn btn-registro w-100">
                    Crear una cuenta
                </a>
            </div>

        </section>

    </main>

</body>
</html>
