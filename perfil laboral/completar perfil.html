<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oportunia - Completar perfil</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="perfil-estatico/completar-perfil.css">
</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container">

            <div class="d-flex align-items-center">

                <a href="/perfil-estatico/perfillaboral.html" class="btn btn-outline-light me-3">
                    ←
                </a>

                <a class="navbar-brand mb-0" href="../index.html">
                    Oportunia
                </a>

            </div>

        </div>
    </nav>

    <main class="container py-4">
        <div class="row g-4">

            <div class="col-12 col-lg-4">
                <div class="card perfil-card">
                    <div class="card-body p-4">

                        <h4>Perfil</h4>

                        <div class="d-flex justify-content-between mt-3">
                            <span>Completar perfil</span>
                            <span>60%</span>
                        </div>

                        <div class="progress my-3">
                            <div class="progress-bar" style="width: 60%;"></div>
                        </div>

                        <div class="list-group">
                            <a href="#datos" class="list-group-item list-group-item-action active">
                                Datos personales
                            </a>

                            <a href="#estudios" class="list-group-item list-group-item-action">
                                Estudios
                            </a>

                            <a href="#habilidades" class="list-group-item list-group-item-action">
                                Habilidades
                            </a>

                            <a href="#cursos" class="list-group-item list-group-item-action">
                                Cursos realizados
                            </a>

                            <a href="#experiencia" class="list-group-item list-group-item-action">
                                Experiencia laboral
                            </a>
                        </div>

                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-8">
                <div class="card formulario-card">
                    <div class="card-body p-4">

                        <h2>Completar perfil</h2>
                        <p class="text-secondary">Registrar perfil</p>

                        <form id="formularioPerfil">

                            <h5 id="datos" class="titulo-seccion">
                                Datos personales
                            </h5>

                            <div class="row">

                                <div class="col-12 col-md-6 mb-3">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
                                </div>

                                <div class="col-12 col-md-6 mb-3">
                                    <label for="apellido" class="form-label">Apellido</label>
                                    <input type="text" class="form-control" id="apellido" placeholder="Tu apellido" required>
                                </div>

                                <div class="col-12 col-md-6 mb-3">
                                    <label for="edad" class="form-label">Edad</label>
                                    <input type="number" class="form-control" id="edad" min="1" max="120" placeholder="Tu edad" required>
                                </div>

                                <div class="col-12 col-md-6 mb-3">
                                    <label for="ciudad" class="form-label">Ciudad / Localidad</label>
                                    <input type="text" class="form-control" id="ciudad" placeholder="Tu ciudad" required>
                                </div>

                                <div class="col-12 mb-3">
                                    <label for="contacto" class="form-label">Medio de contacto</label>
                                    <select class="form-select" id="contacto" required>
                                        <option value="">Seleccioná una opción</option>
                                        <option value="email">Email</option>
                                        <option value="telefono">Teléfono</option>
                                        <option value="ambos">Ambos</option>
                                    </select>
                                </div>

                                <div class="col-12 col-md-6 mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required>
                                </div>

                                <div class="col-12 col-md-6 mb-3">
                                    <label for="telefono" class="form-label">Teléfono</label>
                                    <input type="tel" class="form-control" id="telefono" placeholder="Tu teléfono">
                                </div>

                            </div>

                            <section id="estudios" class="seccion-extra">
                                <h5 class="titulo-seccion">Estudios</h5>

                                <label for="nivelEstudios" class="form-label">Nivel de estudios</label>

                                <select id="nivelEstudios" class="form-select">
                                    <option value="">Seleccioná una opción</option>
                                    <option>Primario</option>
                                    <option>Secundario</option>
                                    <option>Terciario</option>
                                    <option>Universitario</option>
                                    <option>Otro</option>
                                </select>
                            </section>

                            <section id="habilidades" class="seccion-extra">
                                <h5 class="titulo-seccion">Habilidades</h5>

                                <label for="habilidadesTexto" class="form-label">
                                    ¿Qué sabés hacer?
                                </label>

                                <textarea id="habilidadesTexto" class="form-control" rows="3" placeholder="Escribí tus habilidades"></textarea>
                            </section>

                            <section id="cursos" class="seccion-extra">
                                <h5 class="titulo-seccion">Cursos realizados</h5>

                                <label for="cursosTexto" class="form-label">
                                    Cursos o capacitaciones
                                </label>

                                <textarea id="cursosTexto" class="form-control" rows="3" placeholder="Escribí los cursos que realizaste"></textarea>
                            </section>

                            <section id="experiencia" class="seccion-extra">
                                <h5 class="titulo-seccion">Experiencia laboral</h5>

                                <label for="experienciaTexto" class="form-label">
                                    Experiencia
                                </label>

                                <textarea id="experienciaTexto" class="form-control" rows="3" placeholder="Contá tu experiencia laboral"></textarea>
                            </section>

                            <button type="submit" class="btn btn-primary w-100 mt-4">
                                Guardar perfil
                            </button>

                        </form>

                        <a href="/perfil-estatico/perfillaboral.html" class="btn btn-secondary w-100 mt-2">
                            Volver al perfil
                        </a>

                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="text-center py-3">
        <p class="mb-0">Oportunia - Tu futuro laboral</p>
    </footer>
<script>
    const formulario = document.getElementById("formularioPerfil");

    formulario.addEventListener("submit", async function(event) {
        event.preventDefault();

        const datos = {
            nombre: document.getElementById("nombre").value,
            apellido: document.getElementById("apellido").value,
            edad: document.getElementById("edad").value,
            ciudad: document.getElementById("ciudad").value,
            contacto: document.getElementById("contacto").value,
            email: document.getElementById("email").value,
            telefono: document.getElementById("telefono").value,

            nivelEstudios: document.getElementById("nivelEstudios").value,
            habilidadesTexto: document.getElementById("habilidadesTexto").value,
            cursosTexto: document.getElementById("cursosTexto").value,
            experienciaTexto: document.getElementById("experienciaTexto").value
        };

        try {
            const respuesta = await fetch("/guardar-perfil", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(datos)
            });

            const resultado = await respuesta.json();

            if (respuesta.ok) {
                alert("¡Perfil guardado correctamente!");
                formulario.reset();
            } else {
                alert("Error al guardar: " + resultado.error);
            }

        } catch (error) {
            alert("No se pudo conectar con el servidor.");
            console.error(error);
        }
    });
</script>


</body>
</html>
