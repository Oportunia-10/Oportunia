<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oportunia - Crear cuenta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="registrarse.css">
</head>

<body>

    <main class="pagina">

        <section class="registro">

            <header class="encabezado">
                <h1>Oportunia</h1>

                <svg class="icono-accesibilidad"
                     viewBox="0 0 48 48"
                     fill="none"
                     xmlns="http://www.w3.org/2000/svg"
                     aria-label="Accesibilidad">

                    <circle cx="29" cy="7" r="4"
                            stroke="currentColor" stroke-width="3"/>

                    <path d="M27 15L19 19L14 28"
                          stroke="currentColor" stroke-width="3"
                          stroke-linecap="round"/>

                    <path d="M20 18L33 20L38 29"
                          stroke="currentColor" stroke-width="3"
                          stroke-linecap="round"/>

                    <path d="M19 20L23 30L33 31"
                          stroke="currentColor" stroke-width="3"
                          stroke-linecap="round"/>

                    <circle cx="20" cy="34" r="11"
                            stroke="currentColor" stroke-width="3"/>

                    <path d="M32 15L37 13"
                          stroke="currentColor" stroke-width="3"
                          stroke-linecap="round"/>
                </svg>
            </header>

            <h2>Crear una cuenta</h2>

            <p class="texto-login">
                ¿Ya tienes una cuenta?
                <a href="iniciar-sesion.html">Iniciar sesión</a>
            </p>

            <form id="formulario">

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        placeholder="Ingresa tu nombre"
                        required>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        placeholder="Ingresa tu correo"
                        required>
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña</label>
                    <input
                        type="password"
                        id="contrasena"
                        placeholder="Ingresa tu contraseña"
                        minlength="8"
                        required>
                </div>

                <button type="submit" class="btn-registrarse">
                    Registrarse
                </button>

            </form>

            <p id="mensaje"></p>

            <div class="separador">
                <span></span>
                <p>o registrarse con</p>
                <span></span>
            </div>

            <button type="button" class="btn-social"
                onclick="alert('Google necesita configuración de autenticación.')">

                <i class="bi bi-google google-icon"></i>
                Continuar con Google

            </button>

            <button type="button" class="btn-social"
                onclick="alert('Apple necesita configuración de autenticación.')">

                <i class="bi bi-apple apple-icon"></i>
                Continuar con Apple

            </button>

        </section>

    </main>

    <script>
        const formulario = document.getElementById("formulario");
        const mensaje = document.getElementById("mensaje");

        formulario.addEventListener("submit", function(e) {

            e.preventDefault();

            if (!formulario.checkValidity()) {
                formulario.reportValidity();
                return;
            }

            mensaje.textContent =
                "¡Registro completado correctamente!";

            mensaje.style.color = "#3154a4";

            formulario.reset();
        });
    </script>

</body>
</html>
