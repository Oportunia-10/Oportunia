
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oportunia - Inicio</title>

    
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="home-page container-fluid">

        
        <header class="app-header d-flex justify-content-center align-items-center">

            <h1 class="app-title mb-0">Oportunia</h1>

            
            <img
                src="./img/logo de Oportunia.png"
                alt="Logo de Oportunia"
                class="Logo_Oportunia"
            >

        </header>

        
        <form class="search-box input-group" role="search">

            <span class="input-group-text search-icon" aria-hidden="true">
                ⌕
            </span>

            <input
                type="search"
                class="form-control"
                placeholder="Buscar..."
                aria-label="Buscar"
            >

            <button
                class="btn search-button"
                type="submit"
                aria-label="Buscar"
            >
                &gt;
            </button>

        </form>

    </main>

</body>
</html>
