<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajustes - Oportunia</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container-fluid ajustes-container">
        <section class="ajustes-panel">

            <header class="ajustes-header">
                <i class="bi bi-gear-fill"></i>
                <h1>Ajustes</h1>
            </header>

            <nav class="menu-ajustes" aria-label="Opciones de ajustes">

                <a href="#mi-cuenta" class="opcion-ajuste">
                    <i class="bi bi-person"></i>
                    <span>Mi Cuenta</span>
                    <i class="bi bi-chevron-right flecha"></i>
                </a>

                <a href="#accesibilidad" class="opcion-ajuste">
                    <i class="bi bi-universal-access"></i>
                    <span>Accesibilidad</span>
                    <i class="bi bi-chevron-right flecha"></i>
                </a>

                <a href="#notificaciones" class="opcion-ajuste">
                    <i class="bi bi-bell"></i>
                    <span>Notificaciones</span>
                    <i class="bi bi-chevron-right flecha"></i>
                </a>

                <a href="#seguridad" class="opcion-ajuste">
                    <i class="bi bi-shield"></i>
                    <span>Seguridad</span>
                    <i class="bi bi-chevron-right flecha"></i>
                </a>

                <a href="#idioma" class="opcion-ajuste">
                    <i class="bi bi-globe"></i>
                    <span>Idioma</span>
                    <i class="bi bi-chevron-right flecha"></i>
                </a>

                <a href="#cerrar-sesion" class="opcion-ajuste">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Cerrar Sesión</span>
                    <i class="bi bi-chevron-right flecha"></i>
                </a>

            </nav>

            <section class="accesibilidad-panel" id="accesibilidad">

                <div class="configuracion">
                    <div class="titulo-configuracion">
                        <i class="bi bi-fonts"></i>
                        <h2>Tamaño de texto</h2>
                    </div>

                    <div class="opciones-texto">
                        <label>
                            <input
                                type="radio"
                                name="tamano-texto"
                                value="pequeno"
                            >
                            <span>Pequeño</span>
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="tamano-texto"
                                value="mediano"
                                checked
                            >
                            <span>Mediano</span>
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="tamano-texto"
                                value="grande"
                            >
                            <span>Grande</span>
                        </label>
                    </div>
                </div>

                <div class="configuracion fila-configuracion">
                    <div class="titulo-configuracion">
                        <i class="bi bi-circle-half"></i>
                        <h2>Contraste alto</h2>
                    </div>

                    <label class="switch" aria-label="Contraste alto">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="configuracion fila-configuracion">
                    <div class="titulo-configuracion">
                        <i class="bi bi-volume-up"></i>
                        <h2>Lectura en voz alta</h2>
                    </div>

                    <label class="switch" aria-label="Lectura en voz alta">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="configuracion fila-configuracion">
                    <div class="titulo-configuracion">
                        <i class="bi bi-compass"></i>
                        <h2>Navegación simple</h2>
                    </div>

                    <label class="switch" aria-label="Navegación simple">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="configuracion fila-configuracion">
                    <div class="titulo-configuracion">
                        <i class="bi bi-arrows-fullscreen"></i>
                        <div>
                            <h2>Agrandar botones</h2>
                            <small>(+50%)</small>
                        </div>
                    </div>

                    <label class="switch" aria-label="Agrandar botones">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>

            </section>

        </section>
    </main>

</body>
</html>
